# Builds the Docker image and tests it. Pushes to main publish it as
# ghcr.io/<owner>/omniping:edge; a version tag like v1.2.3 publishes :1.2.3,
# :1.2 and :latest, and creates a GitHub release with programs for Linux and
# macOS, Linux packages, and the Windows app as an installer and as portable
# zips.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Image names must be lower case; the repository name may not be.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=ref,event=pr

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for this machine
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: omniping:test
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: sh .github/smoke-test.sh omniping:test

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for every platform and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  programs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Build
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          for p in linux/amd64 linux/arm64 linux/arm darwin/arm64 darwin/amd64; do
            os=${p%/*}; arch=${p#*/}; name=omniping-$v-$os-$arch
            [ "$arch" = arm ] && name=$name"v7"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=7 \
              go build -trimpath -ldflags="-s -w -X main.version=$v" -o "dist/$name" .
          done

      - name: Linux packages
        run: sh .github/build-packages.sh "${GITHUB_REF_NAME#v}" amd64 arm64 arm7

      # The Windows app has no console window, and carries its icon, version
      # and manifest, which go-winres writes to rsrc_windows_*.syso. Each
      # portable zip has OmniPing.exe and the data folder that makes it
      # portable; the installer job packs the amd64 program.
      - name: Build for Windows
        run: |
          v=${GITHUB_REF_NAME#v}
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64,arm64 --product-version "$v" --file-version "$v"
          for arch in amd64 arm64; do
            dir=windows-$arch
            mkdir -p "$dir/data"
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch \
              go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$v" -o "$dir/OmniPing.exe" .
            printf 'OmniPing keeps its settings and history in this folder.\r\nKeep it next to OmniPing.exe.\r\n' > "$dir/data/README.txt"
            (cd "$dir" && zip -r -X "../dist/OmniPing-$v-windows-$arch-portable.zip" OmniPing.exe data)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: programs
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: windows-amd64/OmniPing.exe
          if-no-files-found: error

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: programs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # OmniPing.exe goes to the root folder, where the installer script
      # looks for it.
      - uses: actions/download-artifact@v8
        with:
          name: windows-amd64
          path: .

      - name: Build the installer
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.Substring(1)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$v" "/O$PWD\dist" installer\omniping.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [programs, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: programs
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A version with a dash (v1.1.0-rc.1) is a test version: a pre-release,
        # and its image never becomes :latest. The release notes are the
        # tag's message (git tag -a); a tag without one gets a list of the
        # pull requests instead.
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          notes="--generate-notes"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          if [ -n "$tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > notes.md
            notes="--notes-file notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $notes $pre --title "OmniPing ${GITHUB_REF_NAME#v}"
