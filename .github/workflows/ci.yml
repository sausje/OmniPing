name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Code is formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - name: Tests, pinging with unprivileged ping sockets
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          go test -race ./...

      - name: Ping tests as root, with raw sockets
        run: |
          go test -c -o icmp.test ./internal/icmp
          sudo ./icmp.test -test.v

      - name: Builds for every platform
        run: |
          for p in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/arm64 darwin/amd64; do
            echo "$p"
            GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null . || exit 1
          done

  # The page: Go tests don't run it, so open every page in a headless browser
  # and fail on any script error (Chrome comes with the runner).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Every page opens without errors
        run: |
          go build -o omniping .
          node scripts/browser-check.mjs ./omniping

  # The Linux packages, installed the way a user does: the service, pinging
  # without root, upgrades and removal. The .rpm only gets installed in a
  # Fedora container, which has no systemd to run it.
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - run: sh .github/build-packages.sh 0.0.0 amd64

      - name: Install and run the .deb
        run: sh .github/package-test.sh dist/omniping_amd64.deb

      - name: Install and remove the .rpm
        run: |
          docker run --rm -v "$PWD/dist:/pkg:ro" fedora:latest sh -euc '
            dnf install -y -q /pkg/omniping.x86_64.rpm
            test -x /usr/bin/omniping
            test -f /usr/lib/systemd/system/omniping.service
            test -f /etc/default/omniping
            dnf remove -y -q omniping'

  # The same on an ARM computer, like a Raspberry Pi without Docker. GitHub
  # only offers these runners for free to public repositories.
  linux-package-arm:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - run: sh .github/build-packages.sh 0.0.0 arm64

      - name: Install and run the .deb
        run: sh .github/package-test.sh dist/omniping_arm64.deb

  # The Mac program: its tests, and pinging without root (macOS allows
  # unprivileged ping sockets).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - run: go test ./...

      - name: Pings without root
        run: |
          go build -o omniping .
          ./omniping -data "$RUNNER_TEMP/data" -addr 127.0.0.1:18080 > omniping.log 2>&1 &
          url=http://127.0.0.1:18080
          for _ in $(seq 30); do curl -fsS "$url/healthz" >/dev/null 2>&1 && break; sleep 1; done
          echo "pinging with: $(curl -fsS "$url/api/info" | jq -r .mode)"
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"text":"127.0.0.1 loopback"}' "$url/api/targets" >/dev/null
          sleep 6
          answered=$(curl -fsS "$url/api/samples" | jq '[.series[0].r[]? | select(. >= 0)] | length')
          echo "127.0.0.1 answered $answered times"
          cat omniping.log
          [ "$answered" -ge 3 ]

  # Known security problems in Go itself or in the code OmniPing calls.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable

  # The Windows app: its tests, the program as the release builds it, and
  # the installer, so mistakes in the installer script show up here rather
  # than in a release.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - run: go vet ./...

      - run: go test ./...

      - name: Build the app
        shell: bash
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64
          go build -ldflags=-H=windowsgui -o OmniPing.exe .

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /DAppVersion=0.0.0 "/O$PWD\dist" installer\omniping.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
