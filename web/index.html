<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>OmniPing</title>
<!-- Home-screen app: a fixed name (the title changes while an alert fires), PNG icons, and its own window. -->
<meta name="application-name" content="OmniPing">
<meta name="apple-mobile-web-app-title" content="OmniPing">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f4f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1217">
<link rel="icon" id="favicon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script>
  // Apply the saved theme before the first paint so the page never flashes.
  try {
    var t = localStorage.getItem('op-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="app"><div class="empty"><p>Loading OmniPing…</p></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
